name: "Add labels"

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened


permissions:
  pull-requests: write

jobs:
  apply-label:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const changedFiles = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              },
            )
            const files = changedFiles.map(file => file.filename)

            console.log('##### Modified Files #####')
            console.log(files)
            console.log('##########################')

            // verify packages
            const packagesFiles = files.filter(file => file.startsWith('packages/') && !file.includes('mix_lint_test'))
            const packages = packagesFiles.map(file => file.split('/')[1])
            const newLabels = Array.from(new Set(packages))

            console.log('##### PackagesLabels #####')
            console.log(newLabels)
            console.log('##########################')
            
            // verify repo
            const wasRepoModified = files.filter(file => !file.startsWith('packages/')).length > 0
            if (wasRepoModified) {
              newLabels.push('repo')
              console.log('rep label was added')
            }

            console.log('##### New Labels #####')
            console.log(newLabels)
            console.log('##########################')

            // The pull_request_target payload already contains the current
            // labels, so avoid an unnecessary issue-label lookup.
            const existingLabels = context.payload.pull_request.labels ?? []

            const labelsToAdd = newLabels.filter(label => !existingLabels.some(existingLabel => existingLabel.name === label))
            const labelsToRemove = existingLabels.filter(existingLabel => !newLabels.includes(existingLabel.name))

            console.log('##### Labels to Add #####')
            console.log(labelsToAdd)
            console.log('##########################')

            console.log('##### Labels to Remove #####')
            console.log(labelsToRemove)
            console.log('##########################')

            // Add new labels
            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: labelsToAdd
              })
            }

            // Remove unnecessary labels
            for (const label of labelsToRemove) {
              await github.rest.issues.removeLabel({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label.name
              })
            }
