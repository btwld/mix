name: Publish to pub.dev

on:
  push:
    tags:
      - 'mix-v[0-9]+.[0-9]+.[0-9]+*'
      - 'mix_annotations-v[0-9]+.[0-9]+.[0-9]+*'
      - 'mix_generator-v[0-9]+.[0-9]+.[0-9]+*'
      - 'mix_lint-v[0-9]+.[0-9]+.[0-9]+*'
      - 'mix_protocol-v[0-9]+.[0-9]+.[0-9]+*'
      - 'mix_winds-v[0-9]+.[0-9]+.[0-9]+*'
      - 'mix_chart-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish_mix:
    if: startsWith(github.ref_name, 'mix-v')
    uses: btwld/dart-actions/.github/workflows/publish.yml@main
    with:
      packages_folder_path: "packages"
      packages: |
        mix
    permissions:
      id-token: write
      contents: read

  publish_mix_annotations:
    if: startsWith(github.ref_name, 'mix_annotations-v')
    uses: btwld/dart-actions/.github/workflows/publish.yml@main
    with:
      packages_folder_path: "packages"
      packages: |
        mix_annotations
    permissions:
      id-token: write
      contents: read

  publish_mix_generator:
    if: startsWith(github.ref_name, 'mix_generator-v')
    uses: btwld/dart-actions/.github/workflows/publish.yml@main
    with:
      packages_folder_path: "packages"
      packages: |
        mix_generator
    permissions:
      id-token: write
      contents: read

  publish_mix_lint:
    if: startsWith(github.ref_name, 'mix_lint-v')
    uses: btwld/dart-actions/.github/workflows/publish.yml@main
    with:
      packages_folder_path: "packages"
      packages: |
        mix_lint
    permissions:
      id-token: write
      contents: read

  publish_mix_protocol:
    # pub.dev requires the first version to be published manually. The initial
    # release tag is kept for traceability but must not attempt OIDC publishing.
    if: startsWith(github.ref_name, 'mix_protocol-v') && github.ref_name != 'mix_protocol-v1.0.0-alpha.0'
    uses: btwld/dart-actions/.github/workflows/publish.yml@main
    with:
      packages_folder_path: "packages"
      packages: |
        mix_protocol
    permissions:
      id-token: write
      contents: read

  publish_mix_winds:
    if: startsWith(github.ref_name, 'mix_winds-v')
    uses: btwld/dart-actions/.github/workflows/publish.yml@main
    with:
      packages_folder_path: "packages"
      packages: |
        mix_winds
    permissions:
      id-token: write
      contents: read

  publish_mix_chart:
    if: startsWith(github.ref_name, 'mix_chart-v')
    uses: btwld/dart-actions/.github/workflows/publish.yml@main
    with:
      packages_folder_path: "packages"
      packages: |
        mix_chart
    permissions:
      id-token: write
      contents: read
