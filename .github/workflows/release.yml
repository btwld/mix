name: Tag releases

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated publishable packages to recover (e.g. mix,mix_lint)
        required: true
        type: string

jobs:
  tag-releases:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
      - name: Plan and tag releases
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PACKAGES: ${{ inputs.packages }}
          GH_TOKEN: ${{ github.token }}
        run: |
          plan="$RUNNER_TEMP/release-plan.tsv"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            dart --disable-dart-dev scripts/release.dart plan-for "$PACKAGES" > "$plan"
          else
            dart --disable-dart-dev scripts/release.dart plan "$BEFORE_SHA" > "$plan"
          fi

          echo '### Package release tags' >> "$GITHUB_STEP_SUMMARY"
          report() { echo "- $*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          failed=0
          while IFS=$'\t' read -r tag status detail; do
            if [[ "$status" == blocked ]]; then
              report "$tag: blocked ($detail)"
              failed=1
              continue
            fi
            if [[ "$status" == skipped ]]; then
              report "$tag: skipped ($detail)"
              continue
            fi

            if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$tag" -f sha="$detail" --silent; then
              report "$tag: tag creation failed (expected version bump $detail)"
              failed=1
              continue
            fi

            if gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"; then
              report "$tag: tagged at $detail and publish dispatched"
            else
              report "$tag: tagged, but dispatch failed; run Publish to pub.dev on this tag"
              failed=1
            fi
          done < "$plan"
          exit "$failed"
