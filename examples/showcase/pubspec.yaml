name: mix_showcase
description: Curated Mix examples for core widgets, layouts, snacks, and charts.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  mix: ^2.2.0
  mix_chart:
    path: ../../packages/mix_chart
  mix_annotations: ">=2.2.0-beta.1 <3.0.0"
  remix: ^1.0.0-beta.10
  url_launcher: ^6.3.2
  highlight: ^0.7.0

dev_dependencies:
  remix_cli:
    git:
      url: https://github.com/btwld/remix.git
      ref: v1.0.0-beta.10
      path: packages/remix_cli
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  build_runner:
    version: ^2.11.0
  mix_generator: ">=2.2.0-beta.3 <3.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/previews/
    - lib/examples/core/
    - lib/examples/layouts/
    - lib/examples/charts/
    - lib/examples/snacks/
