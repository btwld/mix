name: mix_lint
description: Analyzer plugin with lint rules and quick fixes for Mix, the Flutter styling framework. Catches Styler, variant, and design-token mistakes.
version: 2.0.1
homepage: https://github.com/btwld/mix
repository: https://github.com/btwld/mix/tree/main/packages/mix_lint
issue_tracker: https://github.com/btwld/mix/issues
topics:
  - lints
  - analyzer
  - flutter
  - design-system

environment:
  sdk: ">=3.12.0 <4.0.0"

# Bump both together. Enabled plugins resolve in one package, so a version
# conflict with another plugin stops all of them from loading.
dependencies:
  analysis_server_plugin: ^0.3.23
  analyzer: ^14.4.0
  yaml: ^3.1.0

dev_dependencies:
  analyzer_plugin: ^0.14.17
  analyzer_testing: ^0.4.2
  mix_annotations:
    version: ^2.2.0
    path: ../mix_annotations
  test: ^1.24.0
  test_reflective_loader: ^0.4.0
  dart_code_metrics_presets: ^2.24.0
  flutter_lints: ^6.0.0
