name: mix_markdown
description: Markdown rendering for Flutter styled with Mix. Supports headings, paragraphs, inline formatting, and GitHub alerts.
version: 0.1.0-beta.2
homepage: https://github.com/btwld/mix
repository: https://github.com/btwld/mix/tree/main/packages/mix_markdown

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  markdown: ^7.3.0
  mix: ^2.4.0
  mix_annotations: ^2.2.0

dev_dependencies:
  build_runner: ^2.11.0
  dart_code_metrics_presets: ^2.24.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mix_generator: ^2.3.0

topics:
  - markdown
  - mix
  - styling
  - ui

screenshots:
  - description: A Markdown document with styled headings, inline formatting, and GitHub alerts, rendered in the light theme.
    path: example/screenshots/document-light.png
  - description: The same document rendered in dark mode.
    path: example/screenshots/document-dark.png
