targets:
  $default:
    builders:
      mix_generator:mix_generator:
        enabled: true
        generate_for:
          - lib/src/specs/**/*.dart  # Only run on spec files
        options:
          debug: false
      mix_generator:spec_styler_generator:
        enabled: true
        generate_for:
          - lib/src/specs/**/*.dart
        options:
          debug: false
      # The consolidated example lives below this package directory, but its
      # Vanilla UI sources resolve Remix types that are not dependencies of Mix.
      # Keep Mix's auto-applied builders scoped to the framework sources.
      mix_generator:styler_generator:
        generate_for:
          - lib/src/**/*.dart
      mix_generator:mixable_generator:
        generate_for:
          - lib/src/**/*.dart
      mix_generator:mix_widget_generator:
        generate_for:
          - lib/src/**/*.dart
      mix_generator:modifier_generator:
        generate_for:
          - lib/src/**/*.dart
